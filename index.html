<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<title>Roamize</title>
<meta name="description" content="Roamize — Nathan's personal trip HQ">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roamize">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ============================================================
   ROAMIZE — design tokens. Change the vibe of the whole app here.
   ============================================================ */
:root{
  --bg:#0b0e14;
  --surface:#131826;
  --surface-2:#1a2133;
  --border:#232c42;
  --text:#e9edf5;
  --muted:#8b95ab;
  --accent:#5176AB;        /* Mize blue */
  --accent-light:#7da2d9;
  --accent-dim:rgba(81,118,171,.18);
  --good:#5fb98a; --warn:#d9a55f; --bad:#d96b6b;
  --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);
}
button{font-family:var(--font);border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{
  font-family:var(--font);background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);border-radius:10px;padding:10px 12px;font-size:15px;width:100%;
  outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
::placeholder{color:var(--muted);opacity:.7}

/* ---------- header ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:900;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(11,14,20,.97),rgba(11,14,20,.88));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.3px;user-select:none}
.logo .mark{
  width:28px;height:28px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;
}
.trip-switch{
  display:flex;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--border);border-radius:999px;padding:7px 12px;
  font-size:14px;font-weight:600;max-width:52vw;
}
.trip-switch span.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-switch svg{flex:none;opacity:.6}

/* ---------- layout ---------- */
main{padding:calc(env(safe-area-inset-top) + 62px) 0 calc(env(safe-area-inset-bottom) + 78px)}
.tab{display:none;padding:14px 16px;animation:fadein .18s ease}
.tab.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:900;
  display:flex;justify-content:space-around;
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
  background:rgba(11,14,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
}
nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px;
  transition:color .15s;
}
nav button.active{color:var(--accent-light)}
nav button svg{width:23px;height:23px}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;
}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-label{
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center;
}
.section-label button{color:var(--accent-light);font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px}
.kv .k{color:var(--muted);flex:none}
.kv .v{text-align:right;word-break:break-word;font-weight:500}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--accent-dim);
  color:var(--accent-light);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;
  white-space:nowrap;flex:none;
}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 10px;line-height:1.5}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:#fff;font-weight:700;font-size:15px;
  border-radius:12px;padding:12px 18px;width:100%;transition:opacity .15s;
}
.btn:active{opacity:.8}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.icon-btn{padding:6px;border-radius:8px;color:var(--muted);display:inline-flex}
.row{display:flex;gap:10px;align-items:center}

/* ---------- home ---------- */
#countdown{
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
  background:linear-gradient(135deg,var(--accent) 0%,#33507e 100%);
  color:#fff;position:relative;overflow:hidden;
}
#countdown .big{font-size:26px;font-weight:800;letter-spacing:-.5px}
#countdown .sub{font-size:13px;opacity:.85;margin-top:2px;font-weight:500}
#goldenRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
#goldenRow::-webkit-scrollbar{display:none}
#mapWrap{position:relative}
#map{
  height:44vh;min-height:300px;border-radius:var(--radius);
  border:1px solid var(--border);z-index:1;
}
.map-toggle{
  position:absolute;top:10px;right:10px;z-index:600;
  background:rgba(19,24,38,.92);border:1px solid var(--border);border-radius:10px;
  padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--text);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.photo-grid img{
  width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);
}
.leaflet-container{background:#0b0e14;font-family:var(--font)}
.pin-dot{
  width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
  background:var(--accent);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);
  display:grid;place-items:center;
}
.pin-dot span{transform:rotate(45deg);font-size:13px}
.pin-dot.base{background:#d9a55f}
.pin-dot.done{background:#3a4763;opacity:.75}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--text);border-radius:12px;border:1px solid var(--border)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.45}
.popup-actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.popup-actions button{font-size:12px;font-weight:700;color:var(--accent-light);padding:4px 0}

.pin-item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--border)}
.pin-item:last-child{border-bottom:none}
.pin-item .emoji{font-size:19px;flex:none}
.pin-item .info{flex:1;min-width:0}
.pin-item .name{font-size:14.5px;font-weight:600}
.pin-item .name.done{text-decoration:line-through;color:var(--muted)}
.pin-item .note{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wind-chip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;flex:none}

.day{margin-bottom:10px}
.day .day-head{display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
.day .day-head .d{font-size:14px;font-weight:700}
.day .day-head .d small{color:var(--muted);font-weight:600;margin-left:6px}
.anchor{
  display:flex;gap:10px;align-items:baseline;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:14px;
}
.anchor .t{color:var(--accent-light);font-weight:700;font-size:12.5px;flex:none;min-width:52px}
.anchor .x{margin-left:auto;color:var(--muted);font-size:16px;padding:0 2px}
.day .open-day{color:var(--muted);font-size:13px;padding:8px 2px;font-style:italic}
.add-anchor{color:var(--accent-light);font-size:12.5px;font-weight:700;padding:7px 2px}

/* ---------- explore feed ---------- */
.feed-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.feed-chips::-webkit-scrollbar{display:none}
.feed-chips button{flex:none;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.feed-chips button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-light)}
.feed-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.feed-card img.hero{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--surface-2);cursor:pointer}
.feed-card .fc-body{padding:12px 14px}
.fc-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:6px;flex-wrap:wrap}
.fc-meta .src{background:var(--surface-2);border-radius:999px;padding:3px 9px}
.fc-meta .live{background:rgba(217,107,107,.18);color:var(--bad);border-radius:999px;padding:3px 9px;font-weight:800;letter-spacing:.04em}
.fc-title{font-size:15px;font-weight:700;line-height:1.35}
.fc-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.fc-actions{display:flex;gap:8px;margin-top:11px}
.fc-actions button{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 0;font-size:12.5px;font-weight:700;color:var(--text)}
.fc-actions button.saved{color:var(--good);border-color:var(--good)}
.fc-actions button.scout{color:var(--accent-light)}
.feed-embed{aspect-ratio:16/9;width:100%;border:none;display:block;background:#000}
.feed-play{position:relative;cursor:pointer}
.feed-play .pp{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;text-shadow:0 2px 14px rgba(0,0,0,.8)}

/* ---------- scout bubble + panel ---------- */
#scoutFab{
  position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:940;
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;
  display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.5);transition:transform .15s;
}
#scoutFab:active{transform:scale(.92)}
#scoutPanel{
  position:fixed;inset:0;z-index:960;background:var(--bg);display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
#scoutPanel.open{display:flex}
#scoutPanel #composer{padding-bottom:calc(env(safe-area-inset-bottom) + 10px + var(--kb,0px))}

/* ---------- reader ---------- */
#reader{position:fixed;inset:0;z-index:1100;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#reader.open{display:flex}
#readerHead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
#readerHead .rt{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#readerBody{flex:1;overflow-y:auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 30px);font-size:15px;line-height:1.65;-webkit-overflow-scrolling:touch}
#readerBody img{max-width:100%;border-radius:12px;margin:10px 0}
#readerBody h3{margin:18px 0 8px}
#readerBody a{color:var(--accent-light)}
#readerBody p{margin-bottom:12px}

/* ---------- route planner ---------- */
#routeBar{
  position:absolute;left:10px;right:10px;bottom:10px;z-index:600;
  background:rgba(19,24,38,.94);border:1px solid var(--border);border-radius:14px;padding:10px 12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#routeBar .rstops{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#routeBar .ralt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
#routeBar .ralt button{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted)}
#routeBar .ralt button.on{border-color:var(--accent);color:var(--accent-light);background:var(--accent-dim)}
#routeBar .racts{display:flex;gap:8px}

/* ---------- map filter + collapsibles ---------- */
#mapFilter{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
#mapFilter::-webkit-scrollbar{display:none}
#mapFilter button{flex:none;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--muted)}
#mapFilter button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-light)}
.section-label .coll{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.section-label .chev{transition:transform .2s;display:inline-block;font-size:10px}
.section-label .chev.closed{transform:rotate(-90deg)}

/* ---------- forecast tab bits ---------- */
.report-top{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.report-grade{font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1}
.report-line{display:flex;gap:8px;font-size:13px;line-height:1.5;margin-top:8px}
.report-line .ri{flex:none}
.wk-row{display:grid;grid-template-columns:52px 30px 1fr auto;gap:8px;align-items:center;padding:7px 0 7px 2px;border-bottom:1px solid var(--border);font-size:13px}
.wk-row:last-child{border-bottom:none}
.wk-row .d{font-weight:700}
.wk-row .d small{display:block;color:var(--muted);font-weight:600;font-size:10.5px}
.wk-row .ic{font-size:19px;text-align:center}
.wk-row .mid{color:var(--muted);font-size:12px;line-height:1.4}
.wk-row .t{font-weight:700;text-align:right}
.wk-row .t small{color:var(--muted);font-weight:600}
.fire-line{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--border)}
.fire-line:last-child{border-bottom:none}
.fire-line b{font-size:13px}
.fire-line .fm{color:var(--muted);margin-left:auto;white-space:nowrap}
#chatBar{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 16px;border-bottom:1px solid var(--border);
}
#chatBar button{color:var(--accent-light);font-size:13px;font-weight:700;padding:4px 0}
.msg strong{font-weight:700}
.msg em{font-style:italic}
.msg code{background:var(--surface-2);border-radius:5px;padding:1px 5px;font-size:13px}
.chat-row{display:flex;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--border)}
.chat-row:last-child{border-bottom:none}
.chat-row .ct{flex:1;min-width:0;cursor:pointer}
.chat-row .ct .t1{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-row .ct .t2{font-size:12px;color:var(--muted);margin-top:2px}
.chat-row .del{color:var(--muted);font-size:15px;padding:6px}
#chatScroll{flex:1;overflow-y:auto;padding:16px 16px 8px;-webkit-overflow-scrolling:touch}
.msg{max-width:86%;margin-bottom:14px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-break:break-word}
.msg.user{
  margin-left:auto;background:var(--accent);color:#fff;
  border-radius:18px 18px 4px 18px;padding:11px 15px;
}
.msg.assistant{margin-right:auto}
.msg.assistant .bubble{padding:2px 0}
.msg .who{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.msg .who .avatar{width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800}
.sugg-card{
  background:var(--surface);border:1px solid var(--accent);border-radius:14px;
  padding:12px 14px;margin:10px 0;
}
.sugg-card .sn{font-weight:700;font-size:14.5px;display:flex;gap:7px;align-items:center}
.sugg-card .sd{font-size:13px;color:var(--muted);margin:5px 0 10px;line-height:1.45}
.sugg-card .btn{padding:9px 14px;font-size:13.5px}
.sugg-card .added{color:var(--good);font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center}
#composer{
  padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;
  background:var(--bg);
}
#chatInput{
  flex:1;border-radius:20px;max-height:110px;resize:none;line-height:1.4;padding:11px 15px;font-size:15px;
}
#sendBtn{
  width:40px;height:40px;flex:none;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;transition:opacity .15s;
}
#sendBtn:disabled{opacity:.4}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.explore-hint{
  display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;
}
.explore-hint::-webkit-scrollbar{display:none}
.explore-hint button{
  flex:none;background:var(--surface);border:1px solid var(--border);border-radius:999px;
  padding:8px 14px;font-size:13px;color:var(--text);font-weight:500;
}

/* ---------- modal / sheet ---------- */
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
#overlay.open{display:flex}
#sheet{
  background:var(--surface);width:100%;max-width:560px;max-height:86dvh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);
  animation:slideup .22s ease;
}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--border);margin:4px auto 14px}
#sheet h2{font-size:18px;font-weight:800;margin-bottom:14px;letter-spacing:-.3px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field-row{display:flex;gap:10px}.field-row .field{flex:1}
.sheet-list button.opt{
  width:100%;display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:12px;
  font-size:15px;font-weight:600;text-align:left;
}
.sheet-list button.opt:active{background:var(--surface-2)}
.sheet-list .opt .sub{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.danger{color:var(--bad)!important}

/* ---------- toast & confetti ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(20px);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:1200;
  opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.4);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-12px;z-index:1300;font-size:18px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}

/* sync spinner */
#syncBtn.spin svg{animation:spinsync 1s linear infinite}
@keyframes spinsync{to{transform:rotate(360deg)}}

/* ============================================================
   FORECAST TAB — air quality, weather week, shoot report
   ============================================================ */
.aq-hero{display:flex;align-items:center;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:10px}
.aq-num{font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.aq-bandlabel{font-size:15.5px;font-weight:700}
.aq-sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.aq-row{display:grid;grid-template-columns:88px 1fr 34px 78px;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.aq-town{color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aq-track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.aq-fill{display:block;height:100%;border-radius:4px;transition:width .5s ease}
.aq-val{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.aq-cat{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aq-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:10.5px;color:var(--muted);font-weight:600}
.aq-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#aqChart{width:100%;height:auto;display:block}
.alert-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.45}
.alert-item:last-child{border-bottom:none}
.alert-item .sev{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:999px;margin-top:1px}
.verdict-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.verdict-conf{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.verdict-call{font-size:12px;font-weight:800;letter-spacing:.07em;padding:6px 13px;border-radius:999px}
.verdict-head{font-size:15.5px;font-weight:700;margin-bottom:6px;line-height:1.4}
.verdict-why{font-size:14px;line-height:1.55}
.verdict-watch{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.5}
.verdict-meta{
  font-size:11.5px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
}
.verdict-meta button{color:var(--accent-light);font-weight:700;font-size:11.5px}
/* foliage tracker */
.fol-hero{display:flex;align-items:center;gap:16px;padding-bottom:12px}
.fol-num{font-size:50px;font-weight:800;letter-spacing:-2px;line-height:1}
.fol-num small{font-size:22px;letter-spacing:0;margin-left:1px;opacity:.85}
.fol-gauge{
  position:relative;height:10px;border-radius:5px;
  background:linear-gradient(90deg,#4f9e6f 0%,#8fc25e 18%,#d9c65f 36%,#e6993f 55%,#d96b6b 74%,#b34d33 90%,#7a5a3d 100%);
}
.fol-mark{
  position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:#fff;
  transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface),0 2px 8px rgba(0,0,0,.5);transition:left .6s ease;
}
.day-head .wsc{display:inline-flex;align-items:center}
.day-head .wsc .wind-chip{font-size:10.5px;padding:2px 7px}

/* ============================================================
   DESKTOP — same app, roomier bones (≥900px)
   ============================================================ */
@media (min-width: 900px){
  nav{
    top:calc(env(safe-area-inset-top) + 58px);bottom:0;left:0;right:auto;width:96px;
    flex-direction:column;justify-content:flex-start;gap:10px;
    padding:22px 12px;border-top:none;border-right:1px solid var(--border);
  }
  nav button{flex:none;padding:12px 0;border-radius:14px}
  nav button:hover{color:var(--accent-light);background:var(--surface)}
  main{margin-left:96px}
  .tab{max-width:1180px;margin:0 auto;padding:22px 32px}
  .btn:hover,.trip-switch:hover{filter:brightness(1.12);cursor:pointer}
  .explore-hint button:hover{border-color:var(--accent);cursor:pointer}

  /* Home: map anchored left, lists right */
  #tab-home.active{
    display:grid;column-gap:26px;
    grid-template-columns:minmax(0,1.1fr) minmax(0,0.9fr);
    grid-template-rows:auto auto auto auto auto auto auto 1fr;
    grid-template-areas:
      "countdown countdown"
      "golden golden"
      "mapfilter mapfilter"
      "map shootlabel"
      "map pinlist"
      "map planlabel"
      "map schedule"
      "map placeswrap";
    align-items:start;
  }
  #countdown{grid-area:countdown}
  #goldenRow{grid-area:golden}
  #mapFilter{grid-area:mapfilter}
  #mapWrap{grid-area:map;position:sticky;top:calc(env(safe-area-inset-top) + 80px)}
  #map{height:calc(100dvh - 300px);min-height:520px}
  #shootLabel{grid-area:shootlabel;margin-top:0}
  #pinList{grid-area:pinlist}
  #planLabel{grid-area:planlabel}
  #schedule{grid-area:schedule}
  #placesWrap{grid-area:placeswrap}

  /* Explore feed: centered column */
  #tab-explore{max-width:860px;margin:0 auto}

  /* Scout: floating panel bottom-right */
  #scoutPanel{
    inset:auto;right:20px;bottom:20px;width:440px;height:min(680px,calc(100dvh - 100px));
    border:1px solid var(--border);border-radius:20px;box-shadow:0 18px 60px rgba(0,0,0,.55);
    overflow:hidden;padding-top:0;
  }
  #scoutFab{bottom:24px;right:20px}
  #scoutFab:hover{filter:brightness(1.15);cursor:pointer}
  #diceBtn{left:118px}
  #readerBody>*{max-width:680px;margin-left:auto;margin-right:auto}
  #readerBody p,#readerBody h3,#readerBody img{display:block}

  /* Details: two columns of cards */
  #tab-details{column-count:2;column-gap:26px}
  #tab-details .card,#tab-details .section-label{break-inside:avoid}

  /* sheets become centered modals */
  #overlay{align-items:center;padding:26px}
  #sheet{border-radius:22px;max-height:82dvh}
  #sheet .grab{display:none}

  #diceBtn{bottom:26px}

  /* Smoke Watch: single centered column */
  #tab-smoke{max-width:780px;margin:0 auto}
}

/* dice fab — left side; Scout's bubble owns the right */
#diceBtn{
  position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:800;
  width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  font-size:23px;display:none;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.45);
  transition:transform .15s;
}
#diceBtn:active{transform:scale(.9) rotate(20deg)}
#diceBtn.show{display:grid}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   ROAMIZE — data layer.
   Everything the app knows lives in one object, saved to
   localStorage. Edit DEFAULT_DATA to change the seed trip,
   or use Settings → Export/Import to move data between devices.
   ============================================================ */
const STORE_KEY = 'roamize.v1';

/* ---------- the trip: New England, October 2026 ----------
   Everything region-specific lives in trip.region so a future trip
   (Moab, the Palouse, wherever) just gets its own block. Nothing
   below the data layer should name a place. */
const NEW_ENGLAND_TRIP = {
  id: 'newengland26',
  name: 'New England Fall',
  emoji: '🍁',
  start: '2026-10-12',
  end: '2026-10-16',
  base: { label: 'Airbnb · Intervale', address: '34 Hemlock Rd, Intervale, NH 03845', lat: 44.1113, lng: -71.1417 },
  region: {
    label: 'Mount Washington Valley',
    /* towns for the AQI / conditions strip — S → N through the valley, plus the VT and ME sides */
    towns: [
      { name: 'North Conway',   lat: 44.0537, lng: -71.1284 },
      { name: 'Jackson',        lat: 44.1445, lng: -71.1856 },
      { name: 'Crawford Notch', lat: 44.2178, lng: -71.4109 },
      { name: 'Lincoln (Kanc)', lat: 44.0470, lng: -71.6704 },
      { name: 'Bethel, ME',     lat: 44.4045, lng: -70.7906 },
      { name: 'St. Johnsbury, VT', lat: 44.4192, lng: -72.0151 }
    ],
    /* Scout reads these every morning for the foliage tracker. Official state reports, updated weekly (NH twice a week). */
    foliageSources: [
      { state: 'NH', name: 'Visit NH foliage report', url: 'https://www.visitnh.gov/plan-your-trip/fall/foliage-report', near: 'White Mountains' },
      { state: 'VT', name: 'Vermont foliage report',   url: 'https://vermontvacation.com/vermont-seasons/fall/fall-foliage-report/', near: 'Northeast Kingdom' },
      { state: 'ME', name: 'Maine foliage report',     url: 'https://www.maine.gov/dacf/mfs/projects/fall_foliage/report/index.shtml', near: 'Western Maine' }
    ],
    nearRegion: 'White Mountains',
    droneNotes: 'White Mountain National Forest is national FOREST, not a national park: recreational drone flight is generally allowed outside designated Wilderness areas (no drones in Wilderness). NH state parks: drones need written permission from the park manager, so launch from outside park boundaries like last trip. Vermont state parks prohibit drones. Maine state parks require a permit. Acadia NP and all national parks: no. Mount Washington summit and the Cog are heavily trafficked, treat as no-go. Watch Class D around Portland Jetport and Class C/D near Manchester and Burlington; the valley itself is mostly Class G.',
    guides: [
      { title: 'NH foliage report (twice weekly)', url: 'https://www.visitnh.gov/plan-your-trip/fall/foliage-report', source: 'Visit NH', sub: 'Regional % color change, updated twice a week through the season. The White Mountains row is your base.' },
      { title: 'Vermont foliage report', url: 'https://vermontvacation.com/vermont-seasons/fall/fall-foliage-report/', source: 'Vermont Tourism', sub: 'State foresters file this weekly with best-bet drives. The Northeast Kingdom is the closest VT color to base.' },
      { title: 'Maine weekly foliage report', url: 'https://www.maine.gov/dacf/mfs/projects/fall_foliage/report/index.shtml', source: 'Maine Forest Service', sub: 'Zone-by-zone % color and leaf drop. Western Maine (Bethel, Rangeley) is the zone within reach.' },
      { title: 'Higher Summits forecast', url: 'https://mountwashington.org/experience-the-weather/higher-summit-forecast.aspx', source: 'Mount Washington Observatory', sub: 'Wind and cloud deck above the valley. If the summits are socked in, the notches usually have fog worth chasing.' },
      { title: 'Kancamagus Highway guide', url: 'https://www.kancamagushighway.com/', source: 'Kancamagus Highway', sub: 'Overlooks and pull-offs along the 34-mile scenic byway west of Conway, with parking notes.' },
      { title: 'White Mountains attractions', url: 'https://www.visitwhitemountains.com/things-to-do/', source: 'Visit White Mountains', sub: 'The regional guide for notches, covered bridges, and scenic drives around the valley.' }
    ]
  },
  logistics: [
    { id: 'l1', type: 'flight', title: 'Flight out · Mon Oct 12', fields: { Airline: 'American', 'Flight #': 'AA 1480 → AA 5129', Departs: 'MCI 11:56 AM', Arrives: 'PWM 6:56 PM (via PHL, 5:21 PM)', Confirmation: 'HCMLHU' }, notes: 'Lands after dark. ~1 hr 30 min drive to Intervale, plan on groceries in Portland or North Conway.' },
    { id: 'l2', type: 'flight', title: 'Flight home · Fri Oct 16', fields: { Airline: 'American', 'Flight #': 'AA 5202 → AA 5085', Departs: 'PWM 10:52 AM', Arrives: 'MCI 3:55 PM (via DCA, 1:56 PM)', Confirmation: 'HCMLHU' }, notes: 'Out the door by ~7:30 AM. Last shoot is Thursday sunset.' },
    { id: 'l3', type: 'car',    title: 'Rental car', fields: { Company: '', 'Pickup': 'PWM', 'Drop-off': 'PWM', Confirmation: '' }, notes: 'Confirm the class you booked is the class you get this time.' },
    { id: 'l4', type: 'stay',   title: 'Airbnb · Intervale', fields: { Address: '34 Hemlock Rd, Intervale, NH 03845', 'Check-in': '', 'Check-out': '', 'Door code': '' }, notes: '' }
  ],
  pins: [],
  schedule: {
    '2026-10-12': [{ id: 'a1', time: '6:56 PM', title: 'Land PWM, drive up to Intervale (~1.5 hr)' }],
    '2026-10-16': [{ id: 'a2', time: '7:30 AM', title: 'Checkout, drive to PWM for the 10:52 flight' }]
  },
  gear: [
    { name: 'Drone + every battery, charged', done: false },
    { name: 'ND filters (actually use them this time)', done: false },
    { name: 'SD cards, formatted', done: false },
    { name: 'RC screen charged + spare joystick knob', done: false },
    { name: 'Osmo Pocket + car mount (job: one full overnight timelapse per night)', done: false },
    { name: 'Hand warmers for batteries, gloves, layers', done: false },
    { name: 'Camera + lenses', done: false },
    { name: 'Chargers / power bank', done: false }
  ]
};

/* Field rules: global Scout memory, carried into EVERY trip. Seeded from the North Shore debrief. */
const SEED_MEMORY = [
  'Day template: shoot morning, home to offload and rest midday, back out for sunset. It worked, keep it.',
  'Drive radius: 45 min from base. Anything further needs a real reason. Driving cost the North Shore trip a full point.',
  'Pre-scout 3 or 4 anchors deeply (parking, launch point, line of sight, backup) rather than 12 shallowly. Leave the rest blank on purpose.',
  'Best light was atmospheric, not golden: fog, overcast, moody cloud. Plan around weather windows more than clock windows.',
  'Arrive without reference images. No recreating other people\'s shots.',
  'Launch from outside park boundaries by default. Fewer signs, fewer permits, best spots were off the main road anyway.',
  'Commit rule: once set up, give it one more battery or one more hour than feels necessary. Every regret last trip was not staying or not going further.',
  'One battery per session, charge everything every night.',
  'Osmo Pocket gets one defined job: a full sunset-to-sunrise timelapse at base, run all the way through.',
  'Shoot D-Log for the whole trip.',
  'Unplanned spots near base outperformed the famous ones. Some of the best material is within 15 min of where I sleep.',
  'Navigation is Apple Maps. Roamize is for the plan, the shoot list, and conditions.'
];

const DEFAULT_DATA = {
  version: 2,
  settings: { apiKey: '', userName: 'Nathan', logoTaps: 0 },
  memory: SEED_MEMORY.slice(),
  activeTripId: NEW_ENGLAND_TRIP.id,
  trips: [JSON.parse(JSON.stringify(NEW_ENGLAND_TRIP))]
};

let DB = load();
function load() {
  let db = null;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) db = JSON.parse(raw);
  } catch (e) {}
  if (!db) db = JSON.parse(JSON.stringify(DEFAULT_DATA));
  return migrate(db);
}
/* one-time upgrades for data that already lives on a device (or in the Gist) */
function migrate(db) {
  let changed = false;
  if (!Array.isArray(db.memory)) { db.memory = SEED_MEMORY.slice(); changed = true; }
  if (!db.trips.some(t => t.id === NEW_ENGLAND_TRIP.id)) {
    db.trips.unshift(JSON.parse(JSON.stringify(NEW_ENGLAND_TRIP)));
    db.activeTripId = NEW_ENGLAND_TRIP.id; changed = true;
  }
  db.trips.forEach(t => { if (!t.region) { t.region = { label: t.name, towns: [], foliageSources: [], guides: [], droneNotes: '' }; changed = true; } });
  if (db.version !== 2) { db.version = 2; changed = true; }
  if (changed) { try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {} }
  return db;
}
function save(bump = true) {
  if (bump) DB.updatedAt = Date.now();
  localStorage.setItem(STORE_KEY, JSON.stringify(DB));
}
function trip() { return DB.trips.find(t => t.id === DB.activeTripId) || DB.trips[0]; }
function uid() { return Math.random().toString(36).slice(2, 9); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- date helpers ---------- */
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(d, opts) { return d.toLocaleDateString('en-US', opts || { weekday:'short', month:'short', day:'numeric' }); }
function isoDate(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function tripDays(t) {
  const out = []; if (!t.start || !t.end) return out;
  let d = parseDate(t.start); const end = parseDate(t.end);
  while (d <= end) { out.push(isoDate(d)); d = new Date(d.getTime() + 86400000); }
  return out;
}
function openDays(t) { return tripDays(t).filter(d => !(t.schedule[d] || []).length); }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------- sheet (bottom modal) ---------- */
const overlay = document.getElementById('overlay');
const sheetEl = document.getElementById('sheet');
function openSheet(html) {
  sheetEl.innerHTML = '<div class="grab"></div>' + html;
  overlay.classList.add('open');
}
function closeSheet() { overlay.classList.remove('open'); sheetEl.innerHTML = ''; }
overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });

/* ============================================================
   SYNC — a private GitHub Gist is the cloud. Free, yours,
   token never leaves this device (secrets are stripped
   from the synced file). Newest copy wins.
   ============================================================ */
async function gh(path, opts = {}) {
  return fetch('https://api.github.com' + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + DB.settings.ghToken, 'Accept': 'application/vnd.github+json', ...(opts.headers || {}) }
  });
}
function syncPayload() {   // never ship secrets to the cloud
  const copy = JSON.parse(JSON.stringify(DB));
  copy.settings.apiKey = ''; copy.settings.ghToken = ''; copy.settings.gistId = ''; copy.settings.ytKey = '';
  return JSON.stringify(copy);
}
async function findGist() {
  if (DB.settings.gistId) {
    const r = await gh('/gists/' + DB.settings.gistId);
    if (r.ok) return r.json();
    DB.settings.gistId = '';
  }
  const r = await gh('/gists?per_page=100');
  if (!r.ok) throw new Error('token');
  const hit = (await r.json()).find(g => g.files && g.files['roamize.json']);
  if (hit) { DB.settings.gistId = hit.id; save(false); return (await gh('/gists/' + hit.id)).json(); }
  return null;
}
async function syncNow() {
  if (!DB.settings.ghToken) { toast('Add a GitHub token in Settings first'); settingsForm(); return; }
  const btn = document.getElementById('syncBtn'); btn.classList.add('spin');
  try {
    const gist = await findGist();
    if (!gist) {
      const r = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Roamize sync — managed by the app', public: false, files: { 'roamize.json': { content: syncPayload() } } }) });
      if (!r.ok) throw new Error('create');
      DB.settings.gistId = (await r.json()).id; save(false);
      toast('Cloud created · synced ⬆');
    } else {
      const f = gist.files['roamize.json'];
      const content = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
      const remote = JSON.parse(content);
      const rAt = remote.updatedAt || 0, lAt = DB.updatedAt || 0;
      if (rAt > lAt) {
        if (confirm('Cloud copy is newer (from your other device). Load it here?')) {
          const keep = { apiKey: DB.settings.apiKey, ghToken: DB.settings.ghToken, gistId: DB.settings.gistId, ytKey: DB.settings.ytKey };
          DB = migrate(remote); DB.settings = { ...DB.settings, ...keep };
          save(false); renderAll(); toast('Pulled latest ⬇');
        }
      } else if (lAt > rAt) {
        const r = await gh('/gists/' + DB.settings.gistId, { method: 'PATCH', body: JSON.stringify({ files: { 'roamize.json': { content: syncPayload() } } }) });
        if (!r.ok) throw new Error('push');
        toast('Pushed to cloud ⬆');
      } else toast('Already in sync ✓');
    }
  } catch (e) { toast('Sync failed — check token & connection'); }
  btn.classList.remove('spin');
}
document.getElementById('syncBtn').addEventListener('click', syncNow);

function renderCountdown() {
  const t = trip();
  const now = new Date(); now.setHours(0,0,0,0);
  const start = parseDate(t.start), end = parseDate(t.end);
  const days = Math.round((start - now) / 86400000);
  let big, sub;
  if (days > 1) { big = `T-minus ${days} days`; sub = `${t.emoji} ${t.name} · ${fmtDate(start)}`; }
  else if (days === 1) { big = 'Tomorrow.'; sub = 'Charge every battery you own 🔋'; }
  else if (now >= start && now <= end) {
    const dayNum = Math.round((now - start) / 86400000) + 1;
    big = `Day ${dayNum} of ${tripDays(t).length}`; sub = 'You’re out there. Go get the shot.';
  } else if (now > end) { big = 'Trip wrapped 🎬'; sub = `${trip().pins.filter(p=>p.done).length}/${trip().pins.length} spots shot`; }

function haversineMi(a, b) {
  const R = 3958.8, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function haversine(a, b) {
  const mi = haversineMi(a, b);
  return mi < 1 ? '< 1 mi' : Math.round(mi) + ' mi';
}

/* ---------- 🚗 Windshield check: how much of each day is driving? ----------
   Matches a day's anchors to pins (by id, or by name), routes base → stops → base
   on OSRM, and flags days where the drive eats the light. */
const WS_CACHE = {};
function dayPins(d) {
  const t = trip();
  const out = [];
  (t.schedule[d] || []).forEach(a => {
    const p = a.pinId ? t.pins.find(x => x.id === a.pinId)
      : t.pins.find(x => x.name.length > 3 && (a.title || '').toLowerCase().includes(x.name.toLowerCase()));
    if (p && !out.includes(p)) out.push(p);
  });
  return out;
}
function fmtDur(sec) { return sec >= 3600 ? Math.floor(sec / 3600) + 'h ' + Math.round(sec % 3600 / 60) + 'm' : Math.round(sec / 60) + ' min'; }
async function windshieldCheck() {
  const t = trip(), b = t.base;
  for (const d of tripDays(t)) {
    const el = document.getElementById('wsc-' + d); if (!el) continue;
    const pins = dayPins(d);
    if (!pins.length) { el.innerHTML = ''; continue; }
    const key = pins.map(p => p.id).sort().join(',') + '|' + b.lat.toFixed(3) + ',' + b.lng.toFixed(3);
    let r = WS_CACHE[key];
    if (!r) {
      try {
        const coords = [b, ...pins, b].map(s => `${s.lng},${s.lat}`).join(';');
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=false`);
        const data = await res.json();
        if (data.code !== 'Ok' || !data.routes?.length) throw 0;
        r = { sec: data.routes[0].duration, mi: data.routes[0].distance / 1609.34, n: pins.length };
        WS_CACHE[key] = r;
      } catch (e) { el.innerHTML = ''; continue; }
    }
    const h = r.sec / 3600;
    const col = h < 2 ? 'var(--good)' : h < 3.5 ? 'var(--warn)' : 'var(--bad)';
    const word = h < 2 ? '' : h < 3.5 ? ' · long day' : ' · too much road';
    el.innerHTML = `<span class="wind-chip" style="background:var(--surface-2);color:${col};margin-left:8px" title="${r.n} stop${r.n === 1 ? '' : 's'} + back to base, ${Math.round(r.mi)} mi">🚗 ${fmtDur(r.sec)}${word}</span>`;
  }
}

/* ============================================================
   WEATHER + GOLDEN HOUR — Open-Meteo, free, no key 🌤️
   ============================================================ */
const wxCache = {};
async function fetchWx(lat, lng) {
  const key = lat.toFixed(2) + ',' + lng.toFixed(2);
  if (wxCache[key] && Date.now() - wxCache[key].at < 30 * 60 * 1000) return wxCache[key].data;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}` +
    `&current=wind_speed_10m,wind_gusts_10m,cloud_cover,temperature_2m,precipitation` +
    `&hourly=wind_speed_120m&daily=sunrise,sunset&wind_speed_unit=mph&temperature_unit=fahrenheit&timezone=auto&forecast_days=2`;
  const res = await fetch(url); const data = await res.json();
  wxCache[key] = { at: Date.now(), data };
  return data;
}
/* wind at ~400 ft AGL (Open-Meteo's 120 m level) for the current hour — what the drone actually feels */
function windAloft(wx) {
  try {
    const now = new Date(), h = now.getHours();
    const i = wx.hourly.time.findIndex(t => t.slice(0, 10) === isoDate(now) && +t.slice(11, 13) === h);
    return i >= 0 ? wx.hourly.wind_speed_120m[i] : null;
  } catch (e) { return null; }
}
function windVerdict(mph, gust) {

   ============================================================ */
/* Scout and the daily reports all run on the same model. Sonnet 5.5 is the current one;
   if Anthropic retires it mid-trip the fallbacks kick in automatically (404 / not_found). */
const SCOUT_MODEL     = 'claude-sonnet-5-5';
const MODEL_FALLBACKS = ['claude-sonnet-5-5', 'claude-sonnet-5', 'claude-sonnet-4-6', 'claude-haiku-4-5'];
async function callClaude({ system, messages, max_tokens = 1200 }) {
  const models = [DB.settings.model || SCOUT_MODEL, ...MODEL_FALLBACKS.filter(m => m !== (DB.settings.model || SCOUT_MODEL))];
  let lastErr = null;
  for (const model of models) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': DB.settings.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'content-type': 'application/json'
      },
      body: JSON.stringify({ model, max_tokens, system, messages })
    });
    const data = await res.json();
    if (data.error) {
      lastErr = { status: res.status, message: data.error.message || 'unknown error' };
      const gone = res.status === 404 || /not_found|model.*(not|un)supported|deprecated|retired/i.test(data.error.message || '');
      if (gone) continue;                      // try the next model
      throw lastErr;
    }
    if (model !== models[0]) { DB.settings.model = model; save(false); toast('Scout switched to ' + model); }
    return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  }
  throw lastErr || { status: 0, message: 'no model available' };
}

/* light markdown: renders **bold**, *italic*, `code` properly instead of raw asterisks */
function mdLite(s) {
  let h = esc(s);
  h = h.replace(/^#{1,4}\s+(.+)$/gm, '<strong>$1</strong>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  return h;
}

/* parse ```suggestion and ```memory blocks into cards */
function renderAssistantContent(el, text) {
  const re = /```(suggestion|memory)\s*([\s\S]*?)```/g;
  let last = 0, m;
  const frag = document.createDocumentFragment();
  function pushText(s) { if (s.trim()) { const p = document.createElement('div'); p.innerHTML = mdLite(s.trim()); p.style.whiteSpace = 'pre-wrap'; frag.appendChild(p); } }
  while ((m = re.exec(text))) {
    pushText(text.slice(last, m.index));
    if (m[1] === 'memory') {
      try {
        const mm = JSON.parse(m[2]), note = mm.note;
        const list = mm.scope === 'global' ? globalMemory() : memory();
        if (note && !list.includes(note)) { list.push(note); save(); }
        const chipEl = document.createElement('div');
        chipEl.className = 'sugg-card';
        chipEl.style.borderColor = 'var(--border)';
        chipEl.innerHTML = `<div class="added">🧠 ${mm.scope === 'global' ? 'Field rule' : 'Remembered'}: <span style="color:var(--text);font-weight:500">${esc(note)}</span></div>`;
        frag.appendChild(chipEl);
      } catch (e) {}
      last = m.index + m[0].length;
      continue;
    }
    try {
      const s = JSON.parse(m[2]);
      const card = document.createElement('div');
      card.className = 'sugg-card';
      const distTxt = (!isNaN(+s.lat) && !isNaN(+s.lng)) ? haversine(trip().base, { lat: +s.lat, lng: +s.lng }) + ' from base' : '';
      card.innerHTML = `<div class="sn">${(PIN_TYPES[s.type] || PIN_TYPES.shoot).emoji} ${esc(s.name)}${distTxt ? `<span style="margin-left:auto;font-size:12px;color:var(--muted);font-weight:600">${distTxt}</span>` : ''}</div>
        <div class="sd">${esc(s.note || '')}${s.launch ? `<br>🚁 ${esc(s.launch)}` : ''}${s.parking ? `<br>🅿️ ${esc(s.parking)}` : ''}${s.date ? `<br>Suggested: ${esc(s.date)}${s.time ? ' · ' + esc(s.time) : ''}` : ''}</div>`;
      const btn = document.createElement('button');
      btn.className = 'btn small'; btn.textContent = '+ Add to trip';
      btn.onclick = () => {
        const pid = uid();
        trip().pins.push({ id: pid, name: s.name, lat: +s.lat, lng: +s.lng, note: s.note || '', launch: s.launch || '', parking: s.parking || '', type: PIN_TYPES[s.type] ? s.type : 'shoot', done: false });
        if (s.date && tripDays(trip()).includes(s.date)) {
          (trip().schedule[s.date] = trip().schedule[s.date] || []).push({ id: uid(), title: s.name, time: s.time || '', pinId: pid });
        }
        save(); renderHome();
        btn.replaceWith(Object.assign(document.createElement('div'), { className: 'added', textContent: '✓ On the map' }));
        toast('Added to Home 📍');
      };
      card.appendChild(btn);
      frag.appendChild(card);
    } catch (e) { pushText(m[0]); }
    last = m.index + m[0].length;
  }
  pushText(text.slice(last));
  el.innerHTML = ''; el.appendChild(frag);
}

async function fetchLinkContext(url) {
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 10000);
    const res = await fetch('https://r.jina.ai/' + url, { signal: ctrl.signal });
    clearTimeout(to);
    if (!res.ok) return null;
    const md = await res.text();
    if (md.length < 100) return null;
    return md.slice(0, 6000);
  } catch (e) { return null; }
}
async function sendChat(preset) {
  if (SENDING) return;
  const input = document.getElementById('chatInput');
  const text = (preset || input.value).trim();
  if (!text) return;
  if (!DB.settings.apiKey) { addBubble('user', text); addBubble('assistant', 'Add your API key in Settings first — then I\'m all yours.'); input.value = ''; return; }
  input.value = ''; input.style.height = 'auto';
  addBubble('user', text);
  if (!CURRENT_CHAT) newChat();
  CURRENT_CHAT.messages.push({ role: 'user', content: text });
  if (!CURRENT_CHAT.title) CURRENT_CHAT.title = text.slice(0, 48);
  persistChat();

  const scroll = document.getElementById('chatScroll');
  const thinking = document.createElement('div');
  thinking.className = 'msg assistant';
  thinking.innerHTML = `<div class="who"><span class="avatar">✦</span>Scout</div><div class="typing"><i></i><i></i><i></i></div>`;
  scroll.appendChild(thinking); scroll.scrollTop = scroll.scrollHeight;

  SENDING = true; document.getElementById('sendBtn').disabled = true;
  try {
    /* if the message has a link, fetch it so Scout can actually read it */
    const msgs = CURRENT_CHAT.messages.slice(-16).map(m => ({ role: m.role, content: m.content }));
    const urlMatch = text.match(/https?:\/\/[^\s)<>"']+/);
    if (urlMatch) {
      const ctx = await fetchLinkContext(urlMatch[0]);
      if (ctx) msgs[msgs.length - 1] = { role: 'user', content: text + '\n\n[Roamize fetched the linked page for you:]\n' + ctx };
    }
    const reply = await callClaude({ system: systemPrompt(), messages: msgs, max_tokens: 1400 });
    thinking.remove();
    CURRENT_CHAT.messages.push({ role: 'assistant', content: reply });
    persistChat();
    addBubble('assistant', reply);
  } catch (e) {
    thinking.remove();
    if (e && e.message) addBubble('assistant', 'API hiccup: ' + e.message + (e.status === 401 ? '\n\nDouble-check your key in Settings.' : ''));
    else addBubble('assistant', 'Couldn\'t reach the API — check your connection and try again.');
  }
  SENDING = false; document.getElementById('sendBtn').disabled = false;
}
document.getElementById('sendBtn').addEventListener('click', () => sendChat());
document.getElementById('chatInput').addEventListener('keydown', e => {

document.getElementById('chatInput').addEventListener('input', function () {

/* ---------- keep composer above the iOS keyboard ---------- */
if (window.visualViewport) {
  let vvTimer;
  const vvFix = () => {
    clearTimeout(vvTimer);
    vvTimer = setTimeout(() => {
      // ONLY intervene while typing in the Explore chat — everywhere else

      const chatFocused = document.activeElement === document.getElementById('chatInput')
        && document.getElementById('scoutPanel').classList.contains('open');
      const vv = window.visualViewport;

      if (chatFocused && kb > 0) {

  window.visualViewport.addEventListener('scroll', vvFix);
  document.getElementById('chatInput').addEventListener('blur', () =>
    setTimeout(() => document.documentElement.style.setProperty('--kb', '0px'), 120));
}

/* ============================================================
   FORECAST 🌤 — foliage tracker, daily shoot report, air quality,
   weather week, and fire activity for wherever the trip is.
   Data: Open-Meteo (weather + CAMS air quality), NWS alerts,
   NIFC fire map, state foliage reports. Reports: Sonnet, ~1-2¢ each.
   ============================================================ */
const REPORT_TTL      = 3 * 60 * 60 * 1000;    // in-trip: re-file every 3 hours
const REPORT_TTL_PRE  = 24 * 60 * 60 * 1000;   // pre-trip: once a day is plenty
/* the conditions strip: the region's towns, or base + nearest shoot pins if none are set */
function corridor() {
  const r = region(), t = trip();
  if (r.towns && r.towns.length) return r.towns;
  const b = t.base, pins = t.pins.filter(p => (p.type || 'shoot') === 'shoot').slice(0, 5).map(p => ({ name: p.name, lat: p.lat, lng: p.lng }));
  return [{ name: b.label || 'Home base', lat: b.lat, lng: b.lng }, ...pins];
}
function smokeFocus() {
  const b = trip().base;
  return (b && b.lat) ? { name: b.label || 'Home base', lat: b.lat, lng: b.lng } : corridor()[0];
}
function smokeState() {
  const t = trip();
  return t.smokeWatch = t.smokeWatch || {};   // holds the cached daily report (legacy fields harmless)
}

/* EPA AQI bands — official categories, colors tuned for the dark theme */
function aqiBand(a) {
  if (a == null || isNaN(a)) return { label: 'No data',        short: '—',      color: '#8b95ab', bg: 'rgba(139,149,171,.14)' };
  if (a <= 50)  return { label: 'Good',                        short: 'Good',   color: '#6cc999', bg: 'rgba(108,201,153,.15)' };
  if (a <= 100) return { label: 'Moderate',                    short: 'Mod',    color: '#f2e276', bg: 'rgba(242,226,118,.13)' };
  if (a <= 150) return { label: 'Unhealthy for sensitive',     short: 'USG',    color: '#e6993f', bg: 'rgba(230,153,63,.16)' };
  if (a <= 200) return { label: 'Unhealthy',                   short: 'Unhlthy',color: '#c74f63', bg: 'rgba(199,79,99,.18)' };
  if (a <= 300) return { label: 'Very unhealthy',              short: 'V.Unh',  color: '#a678dd', bg: 'rgba(166,120,221,.18)' };
  return { label: 'Hazardous',                                 short: 'Hazrd',  color: '#b04562', bg: 'rgba(176,69,98,.2)' };
}

/* ---------- data fetchers (all free, no keys) ---------- */
const aqCache = {};
async function fetchAQ(lat, lng) {
  const key = lat.toFixed(2) + ',' + lng.toFixed(2);
  if (aqCache[key] && Date.now() - aqCache[key].at < 30 * 60 * 1000) return aqCache[key].data;
  const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lng}` +
    `&current=us_aqi,pm2_5&hourly=us_aqi,pm2_5&forecast_days=7&timezone=auto`;
  const res = await fetch(url); const data = await res.json();
  if (data.error) throw new Error(data.reason || 'AQ error');
  aqCache[key] = { at: Date.now(), data };
  return data;
}
function dailyMax(aq) {
  const times = aq.hourly?.time || [], vals = aq.hourly?.us_aqi || [], map = {};
  times.forEach((tm, i) => {
    const d = tm.slice(0, 10), v = vals[i];
    if (v == null) return;
    map[d] = map[d] || { date: d, max: 0, sum: 0, n: 0 };
    map[d].max = Math.max(map[d].max, v); map[d].sum += v; map[d].n++;
  });
  return Object.values(map).map(x => ({ date: x.date, max: Math.round(x.max), avg: Math.round(x.sum / x.n) }))
    .sort((a, b) => a.date < b.date ? -1 : 1);
}
async function fetchAlerts() {
  const f = smokeFocus();
  const res = await fetch(`https://api.weather.gov/alerts/active?point=${f.lat},${f.lng}`, { headers: { 'Accept': 'application/geo+json' } });
  const data = await res.json();
  return (data.features || []).map(x => ({
    event: x.properties.event, severity: x.properties.severity, headline: x.properties.headline || ''
  }));
}
async function fetchFires() {
  const base = 'https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/WFIGS_Incident_Locations_Current/FeatureServer/0/query';
  const f0 = smokeFocus();
  const params = new URLSearchParams({
    where: "IncidentTypeCategory='WF'",
    geometry: JSON.stringify({ xmin: f0.lng - 3, ymin: f0.lat - 2, xmax: f0.lng + 3, ymax: f0.lat + 2, spatialReference: { wkid: 4326 } }),
    geometryType: 'esriGeometryEnvelope', inSR: '4326', spatialRel: 'esriSpatialRelIntersects',
    outFields: 'IncidentName,IncidentSize,PercentContained,FireDiscoveryDateTime',
    returnGeometry: 'true', outSR: '4326', f: 'json'
  });
  const res = await fetch(base + '?' + params);
  const data = await res.json();
  if (data.error) throw new Error('fire map error');
  const f = smokeFocus();
  return (data.features || []).map(x => ({
    name: x.attributes.IncidentName,
    acres: x.attributes.IncidentSize,
    contained: x.attributes.PercentContained,
    found: x.attributes.FireDiscoveryDateTime,
    mi: x.geometry ? Math.round(haversineMi(f, { lat: x.geometry.y, lng: x.geometry.x })) : null
  })).filter(x => x.name).sort((a, b) => (a.mi ?? 9e9) - (b.mi ?? 9e9));
}
const wkCache = {};
async function fetchWeek(lat, lng) {
  const key = lat.toFixed(2) + ',' + lng.toFixed(2);
  if (wkCache[key] && Date.now() - wkCache[key].at < 30 * 60 * 1000) return wkCache[key].data;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,sunrise,sunset` +
    `&hourly=visibility,cloud_cover,wind_speed_10m,wind_speed_120m,wind_gusts_10m,temperature_2m,dew_point_2m,precipitation_probability` +
    `&current=temperature_2m,wind_speed_10m,wind_gusts_10m,cloud_cover,weather_code` +
    `&wind_speed_unit=mph&temperature_unit=fahrenheit&timezone=auto&forecast_days=7`;
  const res = await fetch(url); const data = await res.json();
  if (data.error) throw new Error(data.reason || 'weather error');
  wkCache[key] = { at: Date.now(), data };
  return data;
}
function wmoIcon(c) {
  if (c === 0) return '☀️'; if (c <= 2) return '🌤️'; if (c === 3) return '☁️';
  if (c <= 48) return '🌫️'; if (c <= 57) return '🌦️'; if (c <= 67) return '🌧️';
  if (c <= 77) return '🌨️'; if (c <= 82) return '🌧️'; if (c <= 86) return '🌨️'; return '⛈️';
}

/* ---------- render ---------- */
let SMOKE_DATA = null;
function renderSmoke() {
  const el = document.getElementById('tab-smoke');
  const t = trip();
  const today = isoDate(new Date());
  const inTrip = today >= t.start && today <= t.end;
  const hasFoliage = (region().foliageSources || []).length > 0;
  el.innerHTML = `
    <div class="section-label">Scout's shoot report · ${inTrip ? 'Day ' + (Math.round((parseDate(today) - parseDate(t.start)) / 86400000) + 1) : fmtDate(new Date())}</div>
    <div class="card" id="reportCard"><div class="empty">Waiting on the data…</div></div>
    ${hasFoliage ? `<div class="section-label">🍁 Foliage tracker · ${esc(region().nearRegion || region().label)} <button onclick="pullFoliage(true)">↻ Pull now</button></div>
    <div class="card" id="foliageCard"><div class="empty">Waiting on Scout…</div></div>` : ''}
    <div class="section-label">This week at ${esc(smokeFocus().name)}</div>
    <div class="card" id="weekCard"><div class="empty">Loading the week…</div></div>
    <div class="section-label">Air quality · ${esc(region().label)}</div>
    <div class="card" id="aqNow"><div class="empty">Reading the air…</div></div>
    <div class="section-label">Active fires nearby</div>
    <div class="card" id="fireList"><div class="empty">Checking the national fire map…</div></div>
    <p style="font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:22px;line-height:1.55">
      Weather + air quality: Open-Meteo · Alerts: weather.gov · Fires: NIFC national map · Foliage: official state reports, read daily by Scout.</p>`;
  if (hasFoliage) { renderFoliage(); pullFoliage(false); }
  loadSmoke();
}

async function loadSmoke() {
  const focus = smokeFocus(), CORR = corridor();
  const [corrRes, focusRes, alertsRes, firesRes, weekRes] = await Promise.all([
    Promise.allSettled(CORR.map(p => fetchAQ(p.lat, p.lng))),
    fetchAQ(focus.lat, focus.lng).catch(() => null),
    fetchAlerts().catch(() => null),
    fetchFires().catch(() => null),
    fetchWeek(focus.lat, focus.lng).catch(() => null)
  ]);
  if (!document.getElementById('aqNow')) return;   // user left the tab / re-rendered

  /* --- current corridor --- */
  const corridorVals = CORR.map((p, i) => {
    const r = corrRes[i];
    const ok = r.status === 'fulfilled' && r.value.current && r.value.current.us_aqi != null;
    return { name: p.name, aqi: ok ? Math.round(r.value.current.us_aqi) : null, pm: ok ? r.value.current.pm2_5 : null };
  });
  const fAqi = focusRes?.current?.us_aqi != null ? Math.round(focusRes.current.us_aqi) : null;
  const fb = aqiBand(fAqi);
  const asOf = focusRes?.current?.time ? new Date(focusRes.current.time).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '—';
  const rows = corridorVals.map(c => {
    const b = aqiBand(c.aqi);
    const w = c.aqi == null ? 0 : Math.min(100, c.aqi / 200 * 100);
    return `<div class="aq-row"><span class="aq-town">${esc(c.name)}</span>
      <span class="aq-track"><span class="aq-fill" style="width:${w}%;background:${b.color}"></span></span>
      <span class="aq-val" style="color:${b.color}">${c.aqi ?? '—'}</span>
      <span class="aq-cat" style="color:${b.color}">${b.short}</span></div>`;
  }).join('');
  document.getElementById('aqNow').innerHTML = `
    <div class="aq-hero">
      <div class="aq-num" style="color:${fb.color}">${fAqi ?? '—'}</div>
      <div><div class="aq-bandlabel" style="color:${fb.color}">${fb.label}</div>
        <div class="aq-sub">US AQI at ${esc(focus.name)} · PM2.5 ${focusRes?.current?.pm2_5 != null ? focusRes.current.pm2_5.toFixed(1) + ' µg/m³' : '—'} · as of ${asOf}</div></div>
    </div>
    ${rows}`;

  /* --- week forecast --- */
  const days = focusRes ? dailyMax(focusRes) : [];
  const aqByDate = {}; days.forEach(d => aqByDate[d.date] = d.max);
  const alertsHtml = alertsRes === null
    ? ''
    : alertsRes.length
      ? alertsRes.map(a => {
          const hot = /extreme|severe/i.test(a.severity || '');
          const fg = hot ? 'var(--bad)' : 'var(--warn)';
          const bg = hot ? 'rgba(217,107,107,.18)' : 'rgba(217,165,95,.18)';
          return `<div class="alert-item"><span class="sev" style="background:${bg};color:${fg}">${esc(a.severity || 'Alert')}</span><span><b>${esc(a.event)}</b>${a.headline ? ' — ' + esc(a.headline) : ''}</span></div>`;
        }).join('')
      : `<div style="font-size:12.5px;color:var(--good);font-weight:600;padding:6px 0 2px">✓ No active NWS alerts right now</div>`;
  document.getElementById('weekCard').innerHTML = weekRes && weekRes.daily
    ? renderWeekRows(weekRes, aqByDate) + alertsHtml
    : `<div class="empty">Weather forecast unavailable right now.</div>`;

  /* --- fires, condensed --- */
  const fireEl = document.getElementById('fireList');
  if (firesRes === null) {
    fireEl.innerHTML = `<div class="empty">Couldn't reach the fire map — <a href="https://fire.airnow.gov" target="_blank" style="color:var(--accent-light)">check fire.airnow.gov</a> directly.</div>`;
  } else if (!firesRes.length) {
    fireEl.innerHTML = `<div style="font-size:13.5px;color:var(--good);font-weight:600;padding:4px 0">✓ No active US wildfire incidents on the map near ${esc(region().label)}</div>`;
  } else {
    const fmtAc = a => a == null ? '?' : a >= 1000 ? (Math.round(a / 100) / 10) + 'k ac' : Math.round(a) + ' ac';
    fireEl.innerHTML = firesRes.slice(0, 4).map(f => `
      <div class="fire-line">🔥 <b>${esc(f.name)}</b>
        <span class="fm">${fmtAc(f.acres)} · ${f.contained != null ? f.contained + '%' : '?'} cont. · ${f.mi != null ? f.mi + ' mi' : '—'}</span>
      </div>`).join('') +
      (firesRes.length > 4 ? `<div style="font-size:11.5px;color:var(--muted);padding-top:7px">+ ${firesRes.length - 4} more in the wider region</div>` : '');
  }

  /* --- hand it all to Scout for the daily report --- */
  const todayIso = isoDate(new Date());
  const hourlySlim = [];
  if (weekRes?.hourly?.time) {
    weekRes.hourly.time.forEach((tm, i) => {
      const h = +tm.slice(11, 13);
      if (tm.slice(0, 10) === todayIso && h >= 5 && h <= 22 && h % 2 === 1) {
        const temp = weekRes.hourly.temperature_2m?.[i], dew = weekRes.hourly.dew_point_2m?.[i];
        hourlySlim.push({
          time: tm.slice(11), visibilityMi: weekRes.hourly.visibility ? Math.round(weekRes.hourly.visibility[i] / 160.9) / 10 : null,
          cloudPct: weekRes.hourly.cloud_cover?.[i], windMph: Math.round(weekRes.hourly.wind_speed_10m?.[i] ?? 0),
          windAt400ftMph: Math.round(weekRes.hourly.wind_speed_120m?.[i] ?? 0), gustMph: Math.round(weekRes.hourly.wind_gusts_10m?.[i] ?? 0),
          tempF: temp != null ? Math.round(temp) : null, dewSpreadF: (temp != null && dew != null) ? Math.round(temp - dew) : null,
          precipProb: weekRes.hourly.precipitation_probability?.[i]
        });
      }
    });
  }
  const fol = foliageState().report?.data;
  const aqHourlyToday = [];
  if (focusRes?.hourly?.time) {
    focusRes.hourly.time.forEach((tm, i) => {
      const h = +tm.slice(11, 13);
      if (tm.slice(0, 10) === todayIso && h >= 5 && h <= 22 && h % 3 === 0) aqHourlyToday.push({ time: tm.slice(11), aqi: Math.round(focusRes.hourly.us_aqi[i] ?? 0) });
    });
  }
  SMOKE_DATA = {
    fetchedAt: new Date().toLocaleString('en-US'),
    currentWeather: weekRes?.current || null,
    sunrise: weekRes?.daily?.sunrise?.[0] || null,
    sunset: weekRes?.daily?.sunset?.[0] || null,
    todayHourly: hourlySlim,
    currentCorridorAQI: corridorVals,
    aqiTodayHourly: aqHourlyToday,
    aqiDailyMaxForecast: days,
    todayLowF: weekRes?.daily?.temperature_2m_min?.[0] ?? null,
    tomorrowLowF: weekRes?.daily?.temperature_2m_min?.[1] ?? null,
    weekDaily: weekRes?.daily || null,
    nwsAlerts: (alertsRes || []).map(a => a.event + (a.headline ? ': ' + a.headline : '')),
    firesNearby: (firesRes || []).slice(0, 6).map(f => ({ name: f.name, acres: f.acres, pctContained: f.contained, milesAway: f.mi })),
    foliage: fol ? { pctNearBase: fol.nearPct, stage: fol.stage, summary: fol.summary, bestDrive: fol.bestDrive, peakEta: fol.peakEta, regions: fol.regions } : null,
    unshotSpots: trip().pins.filter(p => (p.type || 'shoot') === 'shoot' && !p.done).map(p => p.name + ' (' + haversine(trip().base, p) + ')' + (p.note ? ' — ' + p.note : '') + (p.launch ? ' | launch: ' + p.launch : ''))
  };
  maybeReport(false);
}

/* week rows — icon, wind/rain/AQI, hi/lo; trip days get an accent edge */
function renderWeekRows(week, aqByDate) {
  const d = week.daily, t = trip(), days = tripDays(t);
  return d.time.map((date, i) => {
    const inTrip = days.includes(date);
    const aqi = aqByDate[date];
    const b = aqi != null ? aqiBand(aqi) : null;
    return `<div class="wk-row" style="${inTrip ? 'box-shadow:inset 3px 0 0 var(--accent);padding-left:8px' : ''}">
      <span class="d">${fmtDate(parseDate(date), { weekday: 'short' })}<small>${fmtDate(parseDate(date), { month: 'short', day: 'numeric' })}</small></span>
      <span class="ic">${wmoIcon(d.weather_code[i])}</span>

async function fetchReportText(url) {

/* Flickr public feed — JSONP, no key; recent uploads tagged with trip spots */
function fetchFlickr() {
  return new Promise(resolve => {
    let done = false;
    window.jsonFlickrFeed = data => {
      if (done) return; done = true;
      resolve((data.items || []).map(i => ({
        kind: 'photo', id: 'fl' + safeId(i.link), title: deent(i.title) || 'Untitled',
        url: i.link, img: (i.media?.m || '').replace('_m.', '_z.'),
        source: 'Flickr', sub: 'by ' + (i.author || '').replace(/.*\("([^"]+)"\).*/, '$1'),
        at: Date.parse(i.published) || Date.now(), taken: Date.parse(i.date_taken) || 0
      })).filter(p => p.img && (!p.taken || Date.now() - p.taken < 5 * 365 * 86400e3)));
    };
    const s = document.createElement('script');
    s.src = 'https://api.flickr.com/services/feeds/photos_public.gne?tags=' + encodeURIComponent(feedTags().join(',')) + '&tagmode=any&format=json';
    s.onerror = () => { if (!done) { done = true; resolve([]); } };

    setTimeout(() => { if (!done) { done = true; resolve([]); } }, 8000);
  });

/* Wikimedia Commons — real photos shot near your pins, last 5 years */
async function fetchWikiPhotos() {
  const pins = trip().pins.filter(p => (p.type || 'shoot') === 'shoot').slice(0, 5);
  const all = [];
  await Promise.all(pins.map(async p => {
    try {
      const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
        '&generator=geosearch&ggsnamespace=6&ggslimit=6&ggsradius=3000' +
        `&ggscoord=${p.lat}%7C${p.lng}&prop=imageinfo&iiprop=url%7Ctimestamp&iiurlwidth=800`;
      const d = await (await fetch(url)).json();
      Object.values(d.query?.pages || {}).forEach(pg => {
        const ii = pg.imageinfo && pg.imageinfo[0];
        if (!ii || !/\.(jpe?g|png)$/i.test(ii.url)) return;
        const ts = Date.parse(ii.timestamp);
        if (Date.now() - ts > 5 * 365 * 86400e3) return;
        all.push({
          kind: 'photo', id: 'wm' + pg.pageid, title: (pg.title || '').replace(/^File:|\.\w+$/g, ''),
          url: ii.descriptionurl || ii.url, img: ii.thumburl, source: 'Wikimedia',
          sub: '📍 Shot near ' + p.name, at: ts
        });
      });
    } catch (e) {}
  }));
  const seen = new Set();
  return all.filter(x => !seen.has(x.id) && seen.add(x.id)).sort((a, b) => b.at - a.at).slice(0, 10);
}
